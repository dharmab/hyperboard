openapi: 3.0.0
info:
  title: Hyperboard API
  version: 0.1.0
security:
  - basicAuth: []
paths:
  /metrics:
    get:
      operationId: getMetrics
      security: []
      responses:
        "200":
          $ref: "#/components/responses/MetricsResponse"
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthyResponse"
  /readyz:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthyResponse"
        "503":
          $ref: "#/components/responses/UnhealthyResponse"
  /api/v1/tags:
    get:
      operationId: getTags
      summary: List tags.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/TagsResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/tags/{tag}:
    put:
      operationId: putTag
      summary: Create or replace a tag by name.
      parameters:
        - $ref: "#/components/parameters/tag"
      requestBody:
        $ref: "#/components/requestBodies/TagRequest"
      responses:
        "200":
          $ref: "#/components/responses/TagResponse"
        "201":
          $ref: "#/components/responses/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    get:
      operationId: getTag
      summary: Get a tag by name.
      parameters:
        - $ref: "#/components/parameters/tag"
      responses:
        "200":
          $ref: "#/components/responses/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    delete:
      operationId: deleteTag
      summary: Delete a tag. The tag will be removed from any posts and tag categories.
      parameters:
        - $ref: "#/components/parameters/tag"
      responses:
        "204":
          $ref: "#/components/responses/DeletedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/tags/{tag}/convert-to-alias:
    post:
      operationId: convertTagToAlias
      summary: Convert a tag to an alias of another tag. Re-tags all posts and merges aliases atomically.
      parameters:
        - $ref: "#/components/parameters/tag"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target
              properties:
                target:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/tagCategories:
    get:
      operationId: getTagCategories
      summary: List tag categories.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/TagCategoriesResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/tagCategories/{tagCategory}:
    put:
      operationId: putTagCategory
      summary: Create or replace a tag category by name.
      parameters:
        - $ref: "#/components/parameters/tagCategory"
      requestBody:
        $ref: "#/components/requestBodies/TagCategoryRequest"
      responses:
        "200":
          $ref: "#/components/responses/TagCategoryResponse"
        "201":
          $ref: "#/components/responses/TagCategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    get:
      operationId: getTagCategory
      summary: Get a tag category by name.
      parameters:
        - $ref: "#/components/parameters/tagCategory"
      responses:
        "200":
          $ref: "#/components/responses/TagCategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    delete:
      operationId: deleteTagCategory
      summary: Delete a tag category. All tags with this category will have their category unset.
      parameters:
        - $ref: "#/components/parameters/tagCategory"
      responses:
        "204":
          $ref: "#/components/responses/DeletedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/posts:
    get:
      operationId: getPosts
      summary: Search for posts.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/search"
      responses:
        "200":
          $ref: "#/components/responses/PostsResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/upload:
    post:
      operationId: uploadPost
      summary: Upload a new post's content.
      requestBody:
        $ref: "#/components/requestBodies/MediaUploadRequest"
      responses:
        "201":
          $ref: "#/components/responses/CreatedPostResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "413":
          $ref: "#/components/responses/RequestEntityTooLargeResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/posts/{id}:
    put:
      operationId: putPost
      summary: Replace a post's metadata. This does not create a new post - use uploadPost to create a new post.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        $ref: "#/components/requestBodies/PostRequest"
      responses:
        "200":
          $ref: "#/components/responses/PostResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    get:
      operationId: getPost
      summary: Get a post's metadata by ID.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          $ref: "#/components/responses/PostResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    delete:
      operationId: deletePost
      summary: Delete a post's metadata and content.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          $ref: "#/components/responses/DeletedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/posts/{id}/content:
    head:
      operationId: headPostContent
      summary: Retrieve a post content file's headers without downloading its body.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          $ref: "#/components/responses/PostContentResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    get:
      operationId: getPostContent
      summary: Stream a post's content file.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          $ref: "#/components/responses/PostContentResponse"
        "206":
          $ref: "#/components/responses/PostContentResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "416":
          $ref: "#/components/responses/RequestedRangeNotSatisfiableResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    put:
      operationId: replacePostContent
      summary: Replace a post's content file. The server re-processes the file and updates contentUrl and mimeType.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        $ref: "#/components/requestBodies/MediaUploadRequest"
      responses:
        "200":
          $ref: "#/components/responses/PostResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "413":
          $ref: "#/components/responses/RequestEntityTooLargeResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/posts/{id}/content/download:
    get:
      operationId: downloadPostContent
      summary: Download a post's content file.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          $ref: "#/components/responses/PostContentDownloadResponse"
        "206":
          $ref: "#/components/responses/PostContentDownloadResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "416":
          $ref: "#/components/responses/RequestedRangeNotSatisfiableResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/posts/{id}/thumbnail:
    get:
      operationId: getPostThumbnail
      summary: Stream a post's thumbnail image.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          $ref: "#/components/responses/PostContentResponse"
        "206":
          $ref: "#/components/responses/PostContentResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "416":
          $ref: "#/components/responses/RequestedRangeNotSatisfiableResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    post:
      operationId: regeneratePostThumbnail
      summary: Regenerate the thumbnail for a post from its existing content.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          $ref: "#/components/responses/PostResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    put:
      operationId: replacePostThumbnail
      summary: Replace a post's thumbnail image. The server processes the image into a WebP thumbnail.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        $ref: "#/components/requestBodies/ImageUploadRequest"
      responses:
        "200":
          $ref: "#/components/responses/PostResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "413":
          $ref: "#/components/responses/RequestEntityTooLargeResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/posts/{id}/similar:
    get:
      operationId: getSimilarPosts
      summary: Get posts that are visually similar to the given post based on perceptual hash.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          $ref: "#/components/responses/PostsResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/notes:
    get:
      operationId: getNotes
      summary: List all notes.
      responses:
        "200":
          $ref: "#/components/responses/NotesResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    post:
      operationId: createNote
      summary: Create a note.
      requestBody:
        $ref: "#/components/requestBodies/NoteRequest"
      responses:
        "201":
          $ref: "#/components/responses/NoteResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/notes/{id}:
    get:
      operationId: getNote
      summary: Get a note by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "types-spec.yaml#/components/schemas/ID"
      responses:
        "200":
          $ref: "#/components/responses/NoteResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    put:
      operationId: putNote
      summary: Update a note by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "types-spec.yaml#/components/schemas/ID"
      requestBody:
        $ref: "#/components/requestBodies/NoteRequest"
      responses:
        "200":
          $ref: "#/components/responses/NoteResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    delete:
      operationId: deleteNote
      summary: Delete a note by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "types-spec.yaml#/components/schemas/ID"
      responses:
        "204":
          $ref: "#/components/responses/DeletedResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
components:
  schemas:
    PostUpdateRequest:
      type: object
      required:
        - id
      properties:
        id:
          $ref: "types-spec.yaml#/components/schemas/ID"
        note:
          type: string
          x-go-type-skip-optional-pointer: true
        tags:
          type: array
          items:
            $ref: "types-spec.yaml#/components/schemas/TagName"
          x-go-type-skip-optional-pointer: true
    TagUpdateRequest:
      type: object
      required:
        - name
      properties:
        name:
          $ref: "types-spec.yaml#/components/schemas/TagName"
        description:
          type: string
          x-go-type-skip-optional-pointer: true
        category:
          $ref: "types-spec.yaml#/components/schemas/TagCategoryName"
        aliases:
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        cascadingTags:
          type: array
          items:
            $ref: "types-spec.yaml#/components/schemas/TagName"
          x-go-type-skip-optional-pointer: true
    TagCategoryUpdateRequest:
      type: object
      required:
        - name
      properties:
        name:
          $ref: "types-spec.yaml#/components/schemas/TagCategoryName"
        description:
          allOf:
            - $ref: "types-spec.yaml#/components/schemas/Description"
          x-go-type-skip-optional-pointer: true
        color:
          type: string
          description: Hex color.
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#888888"
          example: "#ff0000"
          x-go-type-skip-optional-pointer: true
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Cursor:
      type: string
    Limit:
      type: integer
      description: Page size. Omitted or non-positive values use 64; values above 64 are capped at 64.
      default: 64
    Search:
      type: string

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Any username is accepted; the configured administrator password is required.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        $ref: "types-spec.yaml#/components/schemas/ID"
    tagCategory:
      name: tagCategory
      in: path
      required: true
      schema:
        $ref: "types-spec.yaml#/components/schemas/TagCategoryName"
    tag:
      name: tag
      in: path
      required: true
      schema:
        $ref: "types-spec.yaml#/components/schemas/TagName"
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Cursor"
    limit:
      name: limit
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Limit"
    search:
      name: search
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Search"
  requestBodies:
    TagRequest:
      description: Tag fields to create or replace. On create, name must match the path; an existing tag may be renamed.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TagUpdateRequest"
    TagCategoryRequest:
      description: Tag-category fields to create or replace. On create, name must match the path; an existing category may be renamed.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TagCategoryUpdateRequest"
    MediaUploadRequest:
      description: Raw image or video bytes. Content-Type must begin with image/ or video/.
      required: true
      content:
        image/*:
          schema:
            type: string
            format: binary
        video/*:
          schema:
            type: string
            format: binary
    ImageUploadRequest:
      description: Raw image bytes. Content-Type must begin with image/.
      required: true
      content:
        image/*:
          schema:
            type: string
            format: binary
    PostRequest:
      description: Mutable post metadata. The body id must equal the path id.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PostUpdateRequest"
    NoteRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - title
              - content
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 1024
              content:
                type: string
                maxLength: 4194304
  responses:
    MetricsResponse:
      description: Metrics endpoint response. The current implementation returns an empty body.
    HealthyResponse:
      description: The service is healthy or ready.
      content:
        application/json:
          schema:
            type: string
            example: OK
    UnhealthyResponse:
      description: A required dependency is not ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeletedResponse:
      description: Resource deleted successfully
    BadRequestResponse:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnauthorizedResponse:
      description: HTTP Basic authentication credentials are missing or invalid.
      headers:
        WWW-Authenticate:
          description: HTTP Basic authentication challenge.
          schema:
            type: string
            example: Basic realm="hyperboard"
      content:
        text/plain:
          schema:
            type: string
            example: Unauthorized
    ForbiddenResponse:
      description: The authenticated client is not permitted to perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ConflictResponse:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFoundResponse:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequestsResponse:
      description: The client has exceeded an applicable request rate limit.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerErrorResponse:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RequestedRangeNotSatisfiableResponse:
      description: The requested media byte range is invalid or outside the stored object.
      headers:
        Content-Range:
          description: The complete stored object length in the form `bytes */length`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RequestEntityTooLargeResponse:
      description: The media request body exceeds the 4 GiB limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaTypeResponse:
      description: The Content-Type is missing or is not an accepted media type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntityResponse:
      description: The body was declared as supported media but could not be processed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TagResponse:
      description: A tag.
      content:
        application/json:
          schema:
            $ref: "types-spec.yaml#/components/schemas/Tag"
    TagsResponse:
      description: A page of tags.
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: "types-spec.yaml#/components/schemas/Tag"
              cursor:
                $ref: "#/components/schemas/Cursor"
    TagCategoryResponse:
      description: A tag category.
      content:
        application/json:
          schema:
            $ref: "types-spec.yaml#/components/schemas/TagCategory"
    TagCategoriesResponse:
      description: A page of tag categories.
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: "types-spec.yaml#/components/schemas/TagCategory"
              cursor:
                $ref: "#/components/schemas/Cursor"
    PostResponse:
      description: A post.
      content:
        application/json:
          schema:
            $ref: "types-spec.yaml#/components/schemas/Post"
    PostContentResponse:
      description: A post's content file. The response Content-Type matches the stored media type.
      content:
        image/*:
          schema:
            type: string
            format: binary
        video/*:
          schema:
            type: string
            format: binary
    PostContentDownloadResponse:
      description: A post's content file as a download. The response Content-Type matches the stored media type.
      headers:
        Content-Disposition:
          schema:
            type: string
          description: Attachment filename for the downloaded content file.
      content:
        image/*:
          schema:
            type: string
            format: binary
        video/*:
          schema:
            type: string
            format: binary
    CreatedPostResponse:
      description: The newly created post and any visually similar posts.
      content:
        application/json:
          schema:
            type: object
            required:
              - post
            properties:
              post:
                $ref: "types-spec.yaml#/components/schemas/Post"
              similar:
                type: array
                items:
                  $ref: "types-spec.yaml#/components/schemas/Post"
    PostsResponse:
      description: A page of posts.
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: "types-spec.yaml#/components/schemas/Post"
              cursor:
                $ref: "#/components/schemas/Cursor"
    NoteResponse:
      description: A note.
      content:
        application/json:
          schema:
            $ref: "types-spec.yaml#/components/schemas/Note"
    NotesResponse:
      description: A collection of notes.
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: "types-spec.yaml#/components/schemas/Note"
              cursor:
                $ref: "#/components/schemas/Cursor"
